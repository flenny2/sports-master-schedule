<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Single light theme (Dylan, Jul-15 ruling: light-first, no toggle) -->
    <meta name="theme-color" content="#EEF1F5">
    <!-- iOS standalone app (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sports Sched">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sports Schedule</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%230C1522'/%3E%3Cpath d='M6 20 L14 12 L19 17 L26 8' stroke='%23FFC93C' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.svg">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ── Masthead ─────────────────────────────────────────────── -->
    <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>SPORTS<em>SCHEDULE</em></div>
        <button id="btn-refresh" class="refresh-btn" aria-label="Refresh data">
            <svg class="refresh-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 8a5.5 5.5 0 0 1 9.3-4M13.5 8a5.5 5.5 0 0 1-9.3 4"/><path d="M11.5 1v3h3M4.5 15v-3h-3"/></svg>
        </button>
    </header>

    <!-- ── Tab bar — sticky across all views ────────────────────── -->
    <nav class="tab-bar">
        <div class="view-tabs" role="tablist">
            <button class="tab active" data-view="front" aria-current="page">Home</button>
            <button class="tab" data-view="week">Calendar</button>
            <button class="tab tab-playoffs" data-view="playoffs">Playoffs</button>
            <button class="tab" data-view="tables">Tables</button>
        </div>
        <div class="sport-filters" role="group" aria-label="Filter by sport">
            <button class="pill active" data-sport="all" aria-pressed="true">All</button>
            <button class="pill" data-sport="football" aria-pressed="false"><span class="pill-ico football" aria-hidden="true"></span>NFL</button>
            <button class="pill" data-sport="soccer" aria-pressed="false"><span class="pill-ico soccer" aria-hidden="true"></span>Soccer</button>
        </div>
    </nav>

    <!-- ── Main content ─────────────────────────────────────────── -->
    <main>
        <div id="front-view"></div>

        <div id="week-view" class="hidden">
            <!-- Month nav lives with the Calendar — the only view it drives -->
            <div class="week-nav">
                <button id="btn-prev" class="nav-arrow" aria-label="Previous">&lsaquo;</button>
                <span id="week-label">This Month</span>
                <button id="btn-next" class="nav-arrow" aria-label="Next">&rsaquo;</button>
            </div>
            <div id="storyline-filters" class="storyline-filters hidden" role="group" aria-label="Filter by storyline"></div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <div class="detail-panel" id="detail-panel"></div>
        </div>

        <div id="playoffs-view" class="hidden"></div>
        <div id="tables-view" class="hidden"></div>
        <div id="status-message" class="status-message"></div>
    </main>

    <!-- ── Footer ───────────────────────────────────────────────── -->
    <footer>
        <div class="legend">
            <span class="legend-item"><span class="ldot must-watch"></span>Must Watch</span>
            <span class="legend-item"><span class="ldot notable"></span>Notable</span>
            <span class="legend-item"><span class="ldot major-event"></span>Major Event</span>
            <span class="lsep"></span>
            <span class="legend-item"><span class="ldot can-watch"></span>Can Watch</span>
            <span class="legend-item"><span class="ldot will-miss"></span>Will Miss</span>
        </div>
        <p class="footnote">Powered by ESPN public data</p>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
